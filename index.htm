<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reto: Calculadora Básica</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card-calculadora">
    <h2>Calculadora Básica</h2>
    <p>Ingresa dos números y selecciona una operación matemática.</p>

    <div class="inputs-group">
      <input type="number" id="num1" placeholder="Número 1" value="3">
      
      <select id="operador">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
        <option value="%">%</option>
      </select>

      <input type="number" id="num2" placeholder="Número 2" value="4">
    </div>

    <button onclick="ejecutarCalculadora()">Calcular</button>

    <div id="resultado" class="resultado-box">Resultado: 12</div>
  </div>

  <script src="calculadora.js"></script>
</body>
</html>
