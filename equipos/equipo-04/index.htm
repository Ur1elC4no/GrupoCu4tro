<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mínimo Común Múltiplo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Mínimo Común Múltiplo</h1>
    <p>Escribe dos números enteros positivos para calcular su mcm.</p>

    <label for="num1">Número 1</label>
    <input type="number" id="num1" min="1" step="1">

    <label for="num2">Número 2</label>
    <input type="number" id="num2" min="1" step="1">

    <button id="calcular">Calcular</button>

    <p id="resultado" aria-live="polite"></p>
  </main>

  <script src="reto.js"></script>
</body>
</html>
